name: Android APK

on:
  push:
    branches: [codex/chinese-food-catalog]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: ./.github/actions/setup-flutter-cache
      - uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-apk-gradle-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-apk-gradle-
      - uses: ./.github/actions/write-env-file
        with:
          sentry_dns: https://stub@sentry.io/0
          supabase_project_url: https://stub.supabase.co
          supabase_project_anon_key: ci-stub
      - name: Prepare Flutter
        run: |
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs
      - name: Check Chinese food library and portions
        run: |
          python3 tool/test_build_chinese_food_catalog.py
          flutter analyze --no-pub
          flutter test --no-pub \
            test/unit_test/chinese_food_catalog_test.dart \
            test/unit_test/quick_serving_option_test.dart \
            test/unit_test/demo_meal_photos_test.dart \
            test/features/meal_detail/quick_serving_chips_widget_test.dart \
            test/features/meal_detail/quick_serving_chips_screen_test.dart \
            test/core/presentation/widgets/logging_dialog_layout_test.dart
      - name: Prepare release signing
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          : "${KEYSTORE:?Missing signing key}"
          : "${STORE_PASSWORD:?Missing keystore password}"
          : "${KEY_PASSWORD:?Missing key password}"
          : "${KEY_ALIAS:?Missing key alias}"
          printf '%s' "$KEYSTORE" | base64 --decode > android/app/upload-keystore.p12
          cat > android/key.properties <<EOF
          storeType=PKCS12
          storeFile=upload-keystore.p12
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          EOF
      - name: Build signed APK
        run: |
          flutter build apk --release --flavor full --build-number="$((1000 + GITHUB_RUN_NUMBER))"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-full-release.apk dist/diet-diary.apk
          sha256sum dist/diet-diary.apk > dist/SHA256SUMS.txt
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: diet-diary-apk-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - name: Remove signing files
        if: always()
        run: rm -f android/key.properties android/app/upload-keystore.p12
