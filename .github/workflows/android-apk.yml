name: Android APK

on:
  push:
    branches: [main, codex/chinese-food-catalog]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Reclaim space for Android build
        run: |
          sudo rm -rf -- /usr/share/dotnet /usr/share/swift /usr/local/share/powershell
          df -h /
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: ./.github/actions/setup-flutter-cache
      - name: Cache Gradle dependencies and build state
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-cleanup: on-success
          build-scan-publish: false
      - uses: ./.github/actions/write-env-file
        with:
          sentry_dns: https://stub@sentry.io/0
          supabase_project_url: https://stub.supabase.co
          supabase_project_anon_key: ci-stub
      - name: Prepare Flutter
        run: |
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs
      - name: Check food library and nutrition goals
        run: |
          python3 tool/test_build_chinese_food_catalog.py
          python3 tool/test_verify_android_apk.py
          flutter analyze --no-pub
          flutter test --no-pub \
            test/unit_test/chinese_food_catalog_test.dart \
            test/unit_test/quick_serving_option_test.dart \
            test/unit_test/demo_meal_photos_test.dart \
            test/features/meal_detail \
            test/features/add_meal/presentation/add_meal_screen_methods_test.dart \
            test/features/add_meal/presentation/meal_item_card_quantity_test.dart \
            test/features/add_meal/presentation/log_tray_test.dart \
            test/unit_test/config_default_to_raw_food_units_test.dart \
            test/core/presentation/widgets/logging_dialog_layout_test.dart \
            test/unit_test/nutrition_goal_plan_test.dart \
            test/unit_test/tdee_method_test.dart \
            test/unit_test/nutrition_label_test.dart \
            test/unit_test/ai_model_list_api_test.dart \
            test/features/add_meal/presentation/nutrition_label_screen_test.dart \
            test/features/home/presentation/home_page_layout_test.dart \
            test/features/settings/presentation/ai_assist_dialog_test.dart \
            test/unit_test/calorie_goal_calc_test.dart \
            test/unit_test/import_goal_settings_test.dart \
            test/unit_test/import_workouts_usecase_test.dart \
            test/features/home/presentation/widgets/dashboard_widget_test.dart \
            test/features/settings/presentation/bloc/settings_bloc_update_tracked_day_test.dart \
            test/features/settings/presentation/widgets/nutrition_goals_screen_test.dart \
            test/features/settings/presentation/widgets/kcal_goal_info_screen_test.dart
      - name: Prepare release signing
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          : "${KEYSTORE:?Missing signing key}"
          : "${STORE_PASSWORD:?Missing keystore password}"
          : "${KEY_PASSWORD:?Missing key password}"
          : "${KEY_ALIAS:?Missing key alias}"
          printf '%s' "$KEYSTORE" | base64 --decode > android/app/upload-keystore.p12
          cat > android/key.properties <<EOF
          storeType=PKCS12
          storeFile=upload-keystore.p12
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          EOF
      - name: Build signed APK
        run: |
          flutter build apk --release --flavor full --target-platform android-arm64 --build-number="$((1000 + GITHUB_RUN_NUMBER))"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-full-release.apk dist/diet-diary.apk
          sha256sum dist/diet-diary.apk > dist/SHA256SUMS.txt
      - name: Verify APK architecture and packaged food catalog
        run: |
          python3 tool/verify_android_apk.py dist/diet-diary.apk --report dist/BUILD_INFO.json
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: diet-diary-apk-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - name: Free workspace space before saving caches
        if: always()
        run: |
          rm -rf -- build .dart_tool/flutter_build
          df -h .
      - name: Remove signing files
        if: always()
        run: rm -f android/key.properties android/app/upload-keystore.p12
